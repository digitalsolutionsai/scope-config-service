name: Build and Push Docker Image

on:
  push:
    tags:
      - '*-prd'  # Triggers on tags ending with -prd, e.g., 2511.02.1-prd

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: asia-southeast1-docker.pkg.dev
  PROJECT_ID: dsai-production
  REPOSITORY: scope-config-service
  IMAGE_NAME: scope-config-service

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image_size_mb: ${{ steps.image_size.outputs.size_mb }}
      tag: ${{ steps.extract_tag.outputs.tag }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract tag name
        id: extract_tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Building image with tag: $TAG"

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ steps.extract_tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Get image size
        id: image_size
        run: |
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ steps.extract_tag.outputs.tag }}"
          docker pull "$IMAGE_REF"
          SIZE_BYTES=$(docker inspect "$IMAGE_REF" --format='{{.Size}}')
          SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE_BYTES/1024/1024}")
          echo "size_mb=$SIZE_MB" >> $GITHUB_OUTPUT
          echo "size_bytes=$SIZE_BYTES" >> $GITHUB_OUTPUT
          echo "Image size: ${SIZE_MB} MB"

      - name: Image digest
        run: echo "Image pushed successfully with tag ${{ steps.extract_tag.outputs.tag }} (Size - ${{ steps.image_size.outputs.size_mb }} MB)"

      - name: Send Slack notification on success
        if: success()
        uses: ./.github/actions/slack-notify
        with:
          status: 'success'
          environment: 'Production'
          version: ${{ steps.extract_tag.outputs.tag }}
          image_size: ${{ steps.image_size.outputs.size_mb }} MB
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Send Slack notification on failure
        if: failure()
        uses: ./.github/actions/slack-notify
        with:
          status: 'failure'
          environment: 'Production'
          version: ${{ steps.extract_tag.outputs.tag }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract tag name
        id: extract_tag
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Deploying version: $TAG"

      - name: Get tag message
        id: get_tag_message
        run: |
          TAG_MESSAGE=$(git tag -l --format='%(contents)' ${{ steps.extract_tag.outputs.tag }})
          TAG_MESSAGE="${TAG_MESSAGE//'%'/'%25'}"
          TAG_MESSAGE="${TAG_MESSAGE//$'\n'/'\n'}"
          TAG_MESSAGE="${TAG_MESSAGE//$'\r'/'\r'}"
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$TAG_MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # ============================================
      # Message 1: Deployment Started
      # ============================================
      - name: "[M1] Send Slack - Deployment Started"
        uses: ./.github/actions/slack-notify
        with:
          status: 'started'
          title: '🚀 Production Deployment Started'
          version: ${{ steps.extract_tag.outputs.tag }}
          custom_message: |
            *Release Notes:*
            ${{ steps.get_tag_message.outputs.message }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: digitalsolutionsai/dsai-infra
          token: ${{ secrets.DSAI_INFRA_WRITE_TOKEN }}
          path: dsai-infra

      - name: Update production Kubernetes image tag
        id: update_infra
        env:
          TAG_VERSION: ${{ steps.extract_tag.outputs.tag }}
          IMAGE_PATH: ${{ env.REGISTRY }}/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          KUSTOMIZATION_FILE: dsai-infra/k8s/overlays/prod/kustomization.yaml
        run: |
          echo "Updating $IMAGE_PATH to tag $TAG_VERSION in $KUSTOMIZATION_FILE"

          awk -v image="$IMAGE_PATH" -v tag="$TAG_VERSION" '
            $0 == "  - name: " image {
              in_image = 1
              found = 1
              print
              next
            }
            in_image == 1 && $1 == "newTag:" {
              print "    newTag: " tag
              in_image = 0
              next
            }
            { print }
            END {
              if (found != 1) {
                exit 2
              }
            }
          ' "$KUSTOMIZATION_FILE" > "${KUSTOMIZATION_FILE}.tmp"

          mv "${KUSTOMIZATION_FILE}.tmp" "$KUSTOMIZATION_FILE"

          if git -C dsai-infra diff --quiet -- k8s/overlays/prod/kustomization.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No infrastructure tag change needed"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit production Kubernetes image tag
        id: commit_infra
        if: steps.update_infra.outputs.changed == 'true'
        env:
          TAG_VERSION: ${{ steps.extract_tag.outputs.tag }}
        run: |
          cd dsai-infra
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/prod/kustomization.yaml
          git commit -m "chore(prod): deploy scope-config-service ${TAG_VERSION}"
          git push
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # ============================================
      # Message 2: Build Completed → Triggering Infra
      # ============================================
      - name: "[M2] Send Slack - Build Completed, Triggering Infra"
        if: success()
        uses: ./.github/actions/slack-notify
        with:
          status: 'success'
          title: '✅ Build Completed → Triggering dsai-infra'
          version: ${{ steps.extract_tag.outputs.tag }}
          image_size: ${{ needs.build-and-push.outputs.image_size_mb }} MB
          custom_message: |
            ⬆️ Pipeline: Build completed. dsai-infra will deploy shortly.
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}

      # ============================================
      # Message 3: Infra Updated (after commit)
      # ============================================
      - name: "[M3] Send Slack - Infra Updated"
        if: success() && steps.commit_infra.outputs.changed == 'true'
        uses: ./.github/actions/slack-notify
        with:
          status: 'success'
          title: '✅ Infra Updated → dsai-infra Deploying'
          custom_message: |
            Commit: `${{ steps.commit_infra.outputs.commit_sha }}`
            ⏳ Kubernetes deployment in progress...
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}

      # ============================================
      # Failure: Notify on any error
      # ============================================
      - name: Send Slack notification on failure
        if: failure()
        uses: ./.github/actions/slack-notify
        with:
          status: 'failure'
          title: '❌ Deployment Pipeline Failed'
          version: ${{ steps.extract_tag.outputs.tag }}
          image_size: ${{ needs.build-and-push.outputs.image_size_mb }} MB
          custom_message: |
            ⚠️ Please check the workflow logs for details.
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}